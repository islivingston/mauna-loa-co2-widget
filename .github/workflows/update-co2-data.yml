name: Update CO2 data

on:
  workflow_dispatch:
  schedule:
    - cron: '24 12 * * 1'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch NOAA data
        run: node scripts/update-co2-data.mjs

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/co2-*.json data/co2-*.csv; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/co2-*.json data/co2-*.csv
          git commit -m "Update NOAA CO2 data"
          git push
